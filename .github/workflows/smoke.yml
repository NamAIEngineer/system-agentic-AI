name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup check only
        run: python scripts/setup.py --check-only --skip-references
      - name: Local setup without references
        run: python scripts/setup.py --install --skip-references
      - name: Doctor
        run: python scripts/doctor.py --json
      - name: Smoke
        run: python scripts/smoke_test.py
      - name: Reference manifest check only
        run: python scripts/install-references.py --check-only
      - name: Bootstrap contract tests
        run: python -m unittest scripts.test_bootstrap
      - name: Extension policy tests (no browser or network)
        env:
          PYTHONPATH: agent-brain
        run: python -m unittest modules.test_browser_extension_transport
      - name: Extension install plan and integrity (no network)
        run: python scripts/install-browser-extension.py
